# /etc/nginx/conf.d/music.antwen.cn.conf
# antwen music：nginx 只管 HTTPS，其余都转给 127.0.0.1:5175 上的 Node 进程。

server {
  listen 80;
  server_name music.antwen.cn;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;                       # nginx < 1.25 改成：listen 443 ssl http2;
  server_name music.antwen.cn;

  ssl_certificate     /etc/nginx/ssl/music.antwen.cn.pem;
  ssl_certificate_key /etc/nginx/ssl/music.antwen.cn.key;

  client_max_body_size 20m;       # 上传插件 zip

  location / {
    proxy_pass http://127.0.0.1:5175;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    # /api/events 是 SSE（推二维码、登录结果），/api/media 是音频和图片流：不能缓冲
    proxy_buffering off;
    proxy_read_timeout 1h;
  }
}
